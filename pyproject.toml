[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-designer"
version = "1.3.7"
description = "Aplicación de escritorio para planificación, cálculo y diseño de instalaciones fotovoltaicas, con presupuestos, memorias técnicas y mantenimiento en PDF editable."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
license-files = ["LICENSE"]
authors = [{ name = "Enersolred" }]
dependencies = [
    "flask>=2.2",
    "reportlab>=3.6",
    "pywebview>=4.4",
]

[project.urls]
Homepage = "https://enersolred.blogspot.com/"

[project.scripts]
solar = "solar_cli:main"
solar-init = "solar_cli:init_db"

[tool.setuptools]
py-modules = ["app", "database", "desktop", "solar_cli", "version", "updater"]
packages = ["solar"]

[tool.setuptools.package-data]
solar = ["*.py"]

[tool.setuptools.data-files]
"share/solar-designer/templates" = ["templates/*.html"]
"share/solar-designer/static/css" = ["static/css/*.css"]
"share/solar-designer/static/js" = ["static/js/*.js"]
